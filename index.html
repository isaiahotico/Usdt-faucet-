<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperhouse Inc. - USDT Faucet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Ad SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10556663'></script>

    <style>
        body { background-color: #f3f4f6; }
        .loader { border-top-color: #3B82F6; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 mb-4 text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Paperhouse Inc.</h1>
        <p class="text-sm text-gray-500">USDT Auto-Pay Faucet</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
        
        <!-- Status Bar -->
        <div id="status-bar" class="mb-4 text-center hidden">
            <span id="status-text" class="text-blue-600 font-semibold">Verifying...</span>
        </div>

        <!-- Input Section -->
        <div id="input-section" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">FaucetPay Email</label>
                <input type="email" id="user-email" placeholder="name@example.com" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
            </div>
            <button onclick="validateUser()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                <i class="fas fa-check-circle"></i> Verify & Connect
            </button>
        </div>

        <!-- Claim Section (Hidden initially) -->
        <div id="claim-section" class="hidden space-y-4">
            <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-center">
                <p class="text-green-800 font-bold text-lg">Reward: 0.0012 USDT</p>
                <p class="text-xs text-gray-500 mt-1">Paid directly to your wallet</p>
            </div>

            <button id="watch-ad-btn" onclick="watchAdAndClaim()" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-lg transition duration-200 shadow-md flex items-center justify-center gap-2">
                <i class="fas fa-play-circle"></i> Watch Ad & Claim
            </button>

            <div id="cooldown-display" class="hidden text-center p-3 bg-gray-100 rounded-lg">
<p class="text-gray-600 font-medium">Next claim available in:</p>
                <p id="timer" class="text-2xl font-bold text-gray-800">03:00</p>
            </div>
            
            <div class="text-center pt-2">
                <button onclick="logout()" class="text-xs text-gray-400 hover:text-gray-600 underline">Disconnect</button>
            </div>
        </div>

        <!-- Leaderboard Section -->
        <div class="mt-6 border-t pt-4">
            <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
                <i class="fas fa-trophy text-yellow-500"></i> Leaderboard
            </h3>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Daily Top</h4>
                    <ul id="daily-leaderboard" class="space-y-1 text-sm">
                        <li class="text-gray-400 text-center">Loading...</li>
                    </ul>
                </div>
                <div>
                    <h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Weekly Top</h4>
                    <ul id="weekly-leaderboard" class="space-y-1 text-sm">
                        <li class="text-gray-400 text-center">Loading...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="mt-4 text-center text-xs text-gray-400">
        &copy; 2026 Paperhouse Inc. All rights reserved.
    </div>

    <script src="app.js"></script>
</body>
</html>
