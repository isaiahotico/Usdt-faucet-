<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paperhouse Inc. - Premium USDT Faucet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Ad SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --dark-glass: rgba(17, 24, 39, 0.7);
        }

        body { 
            background: radial-gradient(circle at top left, #1e1b4b, #312e81, #4c1d95);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Background Blobs /
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }
        .blob-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: #8b5cf6; animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 350px; height: 350px; background: #ec4899; animation-delay: 2s; }
        .blob-3 { top: 40%; left: 40%; width: 200px; height: 200px; background: #06b6d4; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        / Glassmorphism Card /
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        / Loader /
        .loader { border-top-color: #6366f1; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        / Skeleton Loading /
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        / Custom Scrollbar /
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        / Button Press Effect */
        .btn-press:active { transform: scale(0.98); }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Background Effects -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="blob blob-1 rounded-full"></div>

<div class="blob blob-2 rounded-full"></div>
        <div class="blob blob-3 rounded-full"></div>
    </div>

    <!-- Main Container -->
    <div class="relative w-full max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 pb-24">
        
        <!-- Header -->
        <header class="w-full glass-card rounded-2xl shadow-sm p-4 mb-4 flex justify-between items-center animate-fade-in-down">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-paper-plane"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 leading-tight">Paperhouse</h1>
                    <p class="text-xs text-gray-500 font-medium">Premium Faucet</p>
                </div>
            </div>
            <div id="user-badge" class="hidden px-3 py-1 rounded-full bg-green-100 text-green-700 text-xs font-bold flex items-center gap-1">
                <i class="fas fa-check-circle"></i> Verified
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow space-y-4">
            
            <!-- Status Bar -->
            <div id="status-bar" class="hidden bg-blue-50 border border-blue-100 rounded-xl p-3 text-center shadow-sm transition-all duration-300">
                <span id="status-text" class="text-blue-600 font-semibold text-sm"><i class="fas fa-sync fa-spin mr-2"></i>Processing...</span>
            </div>

            <!-- Input Section -->
            <section id="input-section" class="glass-card rounded-3xl p-6 space-y-5 animate-fade-in-up">
                <div class="text-center mb-2">
                    <h2 class="text-xl font-bold text-gray-800">Connect Wallet</h2>
                    <p class="text-sm text-gray-500 mt-1">Enter your FaucetPay email to start earning.</p>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider ml-1">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" id="user-email" placeholder="name@example.com" 
                            class="w-full pl-10 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white outline-none transition-all duration-200 shadow-inner text-gray-900 placeholder-gray-400">
                    </div>
                </div>

                <button onclick="validateUser()" 
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all duration-200 btn-press flex items-center justify-center gap-2 group">
                    <i class="fas fa-plug group-hover:rotate-12 transition-transform"></i> Connect & Verify
                </button>
            </section>

            <!-- Claim Section -->
            <section id="claim-section" class="hidden space-y-4 animate-fade-in-up">
                
                <!-- Reward Card -->
                <div class="glass-card rounded-3xl p-6 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob"></div>
                    <div class="absolute bottom-0 left-0 w-32 h-32 bg-pink-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob animation-delay-2000"></div>

<div class="relative z-10 text-center">
                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wide mb-1">Daily Reward</p>
                        <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-500 to-emerald-600 drop-shadow-sm">
                            0.0012 USDT
                        </h2>
                        <p class="text-xs text-gray-400 mt-2">Instant payout to your wallet</p>
                    </div>
                </div>

                <!-- Action Button -->
                <button id="watch-ad-btn" onclick="watchAdAndClaim()" 
                    class="w-full bg-white hover:bg-gray-50 text-indigo-600 border border-gray-200 font-bold py-5 rounded-2xl shadow-lg shadow-gray-200/50 transition-all duration-200 btn-press flex items-center justify-center gap-3 group relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-r from-indigo-50 to-purple-50 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    <i class="fas fa-play-circle text-2xl group-hover:scale-110 transition-transform"></i>
                    <span class="relative z-10">Watch Ad & Claim</span>
                </button>

                <!-- Cooldown Timer -->
                <div id="cooldown-display" class="hidden glass-card rounded-2xl p-4 text-center border-l-4 border-indigo-500">
                    <p class="text-gray-500 text-sm font-medium mb-1">Next claim in</p>
                    <p id="timer" class="text-3xl font-mono font-bold text-gray-800 tracking-wider">03:00</p>
                </div>

                <!-- Quick Stats / Info -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white/50 rounded-xl p-3 text-center border border-white/60">
                        <p class="text-xs text-gray-500">Total Paid</p>
                        <p class="font-bold text-gray-800">Global</p>
                    </div>
                    <div class="bg-white/50 rounded-xl p-3 text-center border border-white/60">
                        <p class="text-xs text-gray-500">Your Balance</p>
                        <p id="user-balance" class="font-bold text-gray-800">Loading...</p>
                    </div>
                </div>
            </section>

            <!-- Leaderboard Section -->
            <div class="glass-card rounded-3xl p-6 mt-4">
                <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2 text-lg">
                    <i class="fas fa-crown text-yellow-500"></i> Top Earners
                </h3>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <h4 class="text-xs font-semibold text-gray-500 uppercase mb-3 flex items-center gap-1">
                            <i class="fas fa-calendar-day text-blue-400"></i> Daily
                        </h4>
                        <ul id="daily-leaderboard" class="space-y-2">
                            <!-- Skeleton Loaders -->
                            <li class="h-8 skeleton rounded-lg w-full"></li>
                            <li class="h-8 skeleton rounded-lg w-full"></li>
                            <li class="h-8 skeleton rounded-lg w-full"></li>
                        </ul>
                    </div>
                    <div>
                        <h4 class="text-xs font-semibold text-gray-500 uppercase mb-3 flex items-center gap-1">
                            <i class="fas fa-calendar-week text-purple-400"></i> Weekly
                        </h4>
                        <ul id="weekly-leaderboard" class="space-y-2">
                            <!-- Skeleton Loaders -->
                            <li class="h-8 skeleton rounded-lg w-full"></li>
                            <li class="h-8 skeleton rounded-lg w-full"></li>

<li class="h-8 skeleton rounded-lg w-full"></li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation / Logout -->
        <footer class="mt-4 pt-4 border-t border-white/20 flex justify-between items-center text-xs text-gray-400">
            <span>&copy; 2026 Paperhouse Inc.</span>
            <button onclick="logout()" class="hover:text-white transition-colors underline decoration-dashed">Disconnect</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
